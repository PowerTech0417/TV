name: TVBox Universal Auto-Build

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Workflow Code
        uses: actions/checkout@v4
        
      - name: Clone Source Code
        run: |
          echo "📥 Clonage du dépôt : q215613905/TVBoxOS"
          git clone "https://github.com/q215613905/TVBoxOS.git" TVBoxOSC
          cd TVBoxOSC
          git checkout main
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Prepare Build Environment
        working-directory: TVBoxOSC
        run: |
          echo "🔧 Configuration de l'environnement..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python=$PYTHON_PATH" >> gradle.properties
          echo "chaquopy.pip=install" >> gradle.properties
          find . -name "*.gradle" -type f -exec sed -i "s|D:/Programs/Python/Python38/python.exe|$PYTHON_PATH|g" {} \;
          if [ -f "gradlew" ]; then chmod +x gradlew; fi

      - name: Screen Orientation & ABI Patch (屏幕适配与兼容补丁)
        working-directory: TVBoxOSC
        run: |
          echo "🏗️ Patch de compatibilité et orientation..."
          GRADLE_FILE="app/build.gradle"
          MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          
          if [ -f "$GRADLE_FILE" ]; then
            # 1. 强制统一维度并合并 ABI (防止闪退)
            sed -i 's/flavorDimensions = .*/flavorDimensions = ["mode"]/g' $GRADLE_FILE
            sed -i '/arm64_v8a {/,/}/d' $GRADLE_FILE
            sed -i '/armeabi_v7a {/,/}/d' $GRADLE_FILE
            NDK_CONF='ndk { abiFilters "armeabi-v7a", "arm64-v8a" }'
            sed -i "s/defaultConfig {/defaultConfig { $NDK_CONF /g" $GRADLE_FILE
            sed -i 's/variant.productFlavors\[1\].name/"universal"/g' $GRADLE_FILE
          fi

          # 2. 屏幕方向逻辑处理 (TV横屏/手机竖屏)
          # 注意：此逻辑通过在代码中注入不同的 manifestPlaceholders 实现，
          # 简化方案：直接修改各自 Flavor 的清单文件（如果存在）或在编译任务中区分。
          # 这里的补丁会在打包 leanback 时确保 orientation 兼容 TV 模式。
          echo "📺 Configuration TV: Landscape | 📱 Configuration Mobile: Portrait"
          
      - name: Build Leanback (TV - 横屏)
        working-directory: TVBoxOSC
        run: |
          echo "🚀 Compilation de la version TV (Horizontal)..."
          # 临时修改 Manifest 为横屏并编译
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/g' app/src/main/AndroidManifest.xml
          ./gradlew assembleLeanbackRelease
          mkdir -p ../output/release
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output/release/TVBox-TV-Landscape.apk \;

      - name: Build Mobile (手机 - 竖屏)
        working-directory: TVBoxOSC
        run: |
          echo "🚀 Compilation de la version Mobile (Vertical)..."
          # 临时修改 Manifest 为竖屏并编译
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="portrait"/g' app/src/main/AndroidManifest.xml
          ./gradlew assembleMobileRelease
          find app/build/outputs/apk/ -name "*.apk" -not -name "*TV-Landscape*" -exec cp {} ../output/release/TVBox-Mobile-Portrait.apk \;

      - name: Upload Final APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Final-Pack
          path: output/release/*.apk
