name: TVBox Universal Auto-Build

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Workflow Code
        uses: actions/checkout@v4
        
      - name: Clone Source Code
        run: |
          echo "📥 Clonage du dépôt..."
          git clone https://github.com/${{ github.event.inputs.user_name }}/${{ github.event.inputs.repo_name }}.git TVBoxOSC
          cd TVBoxOSC
          git checkout ${{ github.event.inputs.branch_name }}
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Prepare Build Environment
        working-directory: TVBoxOSC
        run: |
          echo "🔧 Configuration de l'environnement..."
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          
          PYTHON_PATH=$(which python3)
          echo "chaquopy.python=$PYTHON_PATH" >> gradle.properties
          echo "chaquopy.pip=install" >> gradle.properties
          
          # 修复 Python 路径
          find . -name "*.gradle" -type f -exec sed -i "s|D:/Programs/Python/Python38/python.exe|$PYTHON_PATH|g" {} \;
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Advanced Compatibility Patch
        working-directory: TVBoxOSC
        run: |
          echo "🏗️ Patch de compatibilité universelle..."
          GRADLE_FILE="app/build.gradle"
          
          if [ -f "$GRADLE_FILE" ]; then
            # 1. 移除多维度，统一架构到 defaultConfig
            sed -i 's/flavorDimensions = .*/flavorDimensions = ["mode"]/g' $GRADLE_FILE
            
            # 2. 删除原有的 ABI Flavor 块（防止干扰）
            sed -i '/arm64_v8a {/,/}/d' $GRADLE_FILE
            sed -i '/armeabi_v7a {/,/}/d' $GRADLE_FILE
            
            # 3. 注入全架构支持 (32位 + 64位)
            NDK_CONF='ndk { abiFilters "armeabi-v7a", "arm64-v8a" }'
            sed -i "s/defaultConfig {/defaultConfig { $NDK_CONF /g" $GRADLE_FILE
            
            # 4. 修复文件名逻辑，移除对不存在维度的引用
            sed -i 's/variant.productFlavors\[1\].name/"universal"/g' $GRADLE_FILE
          fi

      - name: Build with Gradle
        working-directory: TVBoxOSC
        run: |
          echo "🚀 Compilation de tous les variants..."
          # 使用 assembleRelease 会自动编译所有剩余的 Flavor (Leanback 和 Mobile)
          ./gradlew assembleRelease --stacktrace
          
      - name: Organize Output
        working-directory: TVBoxOSC
        run: |
          mkdir -p output/release
          # 递归寻找所有生成的 APK 并移动到统一目录
          find app/build/outputs/apk/ -name "*.apk" -type f | while read file; do
            # 获取文件名并清理掉不必要的路径
            FILENAME=$(basename "$file")
            echo "📦 Traitement de : $FILENAME"
            cp "$file" "output/release/$FILENAME"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Universal-Release
          path: TVBoxOSC/output/release/*.apk
