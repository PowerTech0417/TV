name: Android CI

on:
  push:
    branches: [ "main", "master" ] # 当你推送到 main 或 master 分支时触发
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你手动点击按钮运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Leanback Release APK
      run: ./gradlew assembleLeanbackRelease

    - name: Build Mobile Release APK
      run: ./gradlew assembleMobileRelease

    - name: Upload Leanback APK
      uses: actions/upload-artifact@v4
      with:
        name: TVBox-Leanback-Release
        path: app/build/outputs/apk/leanback/release/*.apk

    - name: Upload Mobile APK
      uses: actions/upload-artifact@v4
      with:
        name: TVBox-Mobile-Release
        path: app/build/outputs/apk/mobile/release/*.apk
