# 编译内存优化：GitHub Actions 建议 4G 到 6G
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED

# 开启并行构建和缓存，加快 GitHub Actions 速度
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# 核心兼容性设置
android.useAndroidX=true
# 必须开启 Jetifier，因为你的依赖项中包含旧版 support 库（如之前报错提到的 AndroidAutoSize）
android.enableJetifier=true

# 资源处理优化，减少 R 文件冲突
android.nonFinalResIds=false
android.nonTransitiveRClass=false

# 解决 Dex 转换过程中的类路径问题，防止某些类找不到
android.useFullClasspathForDexingTransform=true

# 抑制 Gradle 8.x 以上版本的一些严格警告，防止编译因警告中断
android.suppressUntrustedCertificatesCheck=true
